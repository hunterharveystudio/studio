<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hunter Harvey</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #fafafa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 40px;
            align-items: center;
        }

        img {
            width: 100%;
            height: auto;
            display: block;
        }

        .contact {
            display: flex;
            gap: 24px;
            font-size: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }

        a {
            text-decoration: none;
            color: #000;
            border-bottom: 1px solid #000;
            transition: opacity 0.2s;
        }

        a:hover {
            opacity: 0.6;
        }

        @media (max-width: 600px) {
            .container {
                gap: 30px;
            }

            .contact {
                gap: 16px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="work.jpg" alt="This Used To Be A Gay Bar">
        
        <div class="contact">
            <a href="mailto:hunterharveystudio@gmail.com">Email</a>
            <a href="https://instagram.com/_hunter" target="_blank">Instagram</a>
        </div>
    </div>
</body>
</html>
