<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hunter Harvey</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #fafafa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 40px;
            align-items: center;
        }

        img {
            width: 100%;
            height: auto;
            display: block;
        }

        .contact {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }

        .email {
            font-size: 14px;
            color: #999;
            text-transform: lowercase;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .email:hover {
            opacity: 0.6;
        }

        .instagram {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .instagram a {
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .instagram svg {
            width: 20px;
            height: 20px;
            stroke: #000;
            stroke-width: 1.5;
            fill: none;
            transition: opacity 0.2s;
        }

        .instagram a:hover svg {
            opacity: 0.6;
        }
