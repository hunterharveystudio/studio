<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hunter Harvey - Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #fafafa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            padding: 40px 20px;
        }

        .header {
            max-width: 800px;
            margin: 0 auto 60px;
        }

        a {
            color: #000;
            text-decoration: none;
            font-size: 14px;
            transition: opacity 0.2s;
        }

        a:hover {
            opacity: 0.6;
        }

        .gallery {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 80px;
        }

        .work {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        img {
            width: 100%;
            height: auto;
            display: block;
        }

        @media (max-width: 600px) {
            body {
                padding: 30px 15px;
            }

            .header {
                margin-bottom: 40px;
            }

            .gallery {
                gap: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="index.html">← Back</a>
    </div>

    <div class="gallery">
        <div class="work">
            <img src="img1.jpg" alt="Imagine Living In America">
        </div>
        <div class="work">
            <img src="img2.jpg" alt="Horse Money">
        </div>
        <div class="work">
            <img src="img3.jpg" alt="May The Bridges We Burn Light Our Way">
        </div>
        <div class="work">
            <img src="img4.jpg" alt="Yes I Have Tried Spaghetti">
        </div>
        <div class="work">
            <img src="img5.jpg" alt="2 Gay Clocks">
        </div>
        <div class="work">
            <img src="img6.jpg" alt="I Love Happy Hours">
        </div>
        <div class="work">
            <img src="img7.jpg" alt="It's Pronounced Wilshire">
        </div>
        <div class="work">
            <img src="img8.jpg" alt="It's Pronounced Wilshire">
        </div>
    </div>
</body>
</html>
